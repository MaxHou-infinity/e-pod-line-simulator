name: 功能建议
description: 提议新的使用场景、分析能力或体验改进
title: "[建议]: "
body:
  - type: markdown
    attributes:
      value: |
        好的建议应先说明要解决的问题，而不只是指定实现方式。请勿提交机密业务数据。
  - type: dropdown
    id: user-role
    attributes:
      label: 主要使用者
      options:
        - IE / 工业工程师
        - 产线或车间管理者
        - 精益生产顾问
        - HRBP / 人力规划人员
        - 其他
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 目前在哪个工作环节遇到困难？这会造成什么影响？
    validations:
      required: true
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 请给出具体的输入、操作和期望获得的决策信息。
      placeholder: 当我需要……时，我希望……，从而可以……
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 如有偏好的交互或输出形式，可以在这里说明。
  - type: textarea
    id: alternatives
    attributes:
      label: 当前替代方式
      description: 目前如何完成这项工作？现有方式为什么不够？
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue，未发现相同建议。
          required: true
        - label: 我没有在内容或附件中包含敏感信息。
          required: true
