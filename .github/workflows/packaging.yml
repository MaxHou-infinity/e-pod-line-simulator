name: Packaging

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-package:
    name: Build distributable zip
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble package
        run: |
          set -euxo pipefail
          TAG="${GITHUB_REF_NAME}"
          STAGE="package/E-Pod-Line-Simulator-${TAG}"
          mkdir -p "${STAGE}/docs/images"
          rsync -a \
            --exclude '__pycache__' \
            --exclude '.pytest_cache' \
            --exclude '.coverage' \
            --exclude '.DS_Store' \
            --exclude 'logs' \
            --exclude '*.log' \
            e_pod_line_simulator "${STAGE}/"
          cp README.md AGENTS.md LICENSE CHANGELOG.md .gitignore \
            "电子烟产线仿真优化.md" "电子烟产线仿真优化 2.md" \
            方案一.json 方案2.json "${STAGE}/"
          cp docs/images/screenshot_main.png "${STAGE}/docs/images/"
          cd package
          zip -rq "../E-Pod-Line-Simulator-${TAG}.zip" "E-Pod-Line-Simulator-${TAG}"
          cd ..
          unzip -l "E-Pod-Line-Simulator-${TAG}.zip" | tail -1

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: E-Pod-Line-Simulator-${{ github.ref_name }}
          path: E-Pod-Line-Simulator-${{ github.ref_name }}.zip
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          TAG="${GITHUB_REF_NAME}"
          ZIP="E-Pod-Line-Simulator-${TAG}.zip"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "${ZIP}" --clobber
          else
            gh release create "${TAG}" "${ZIP}" --title "${TAG} 发布" --generate-notes
          fi

  build-windows:
    name: Build Windows EXE (PyInstaller)
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    defaults:
      run:
        working-directory: e_pod_line_simulator
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Build EXE with PyInstaller
        run: |
          pyinstaller --noconfirm --windowed --name "E-Pod-Line-Simulator" `
            --add-data "assets;assets" `
            --add-data "configs;configs" `
            run.py

      - name: Zip dist folder
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/E-Pod-Line-Simulator/*" `
            -DestinationPath "$env:GITHUB_WORKSPACE/E-Pod-Line-Simulator-Windows-$env:GITHUB_REF_NAME.zip" `
            -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: E-Pod-Line-Simulator-Windows-${{ github.ref_name }}
          path: E-Pod-Line-Simulator-Windows-${{ github.ref_name }}.zip
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $zip = "$env:GITHUB_WORKSPACE/E-Pod-Line-Simulator-Windows-$tag.zip"
          gh release view $tag | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $zip --clobber
          } else {
            gh release create $tag $zip --title "$tag 发布" --generate-notes
          }

  build-app:
    name: Build macOS App (PyInstaller)
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: macos-latest
    defaults:
      run:
        working-directory: e_pod_line_simulator
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Build app with PyInstaller
        run: pyinstaller --noconfirm packaging/e_pod_line_simulator.spec

      - name: Zip app
        run: |
          ditto -c -k --keepParent \
            "dist/E-Pod-Line-Simulator.app" \
            "${GITHUB_WORKSPACE}/E-Pod-Line-Simulator-macOS-${{ github.ref_name }}.zip"

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: E-Pod-Line-Simulator-macOS-${{ github.ref_name }}
          path: E-Pod-Line-Simulator-macOS-${{ github.ref_name }}.zip
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          ZIP="${GITHUB_WORKSPACE}/E-Pod-Line-Simulator-macOS-${TAG}.zip"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "${ZIP}" --clobber
          else
            gh release create "${TAG}" "${ZIP}" --title "${TAG} 发布" --generate-notes
          fi
